name: Build and Test on push
on:
  push:
    branches:
      - main
      - 'release/*'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
      - name: Test
        run: npm test
 